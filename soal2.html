
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaksi jQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        #kotak {
            width: 200px;
            height: 200px;
            background-color: purple;
            margin: 20px auto;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Interaksi Warna dengan jQuery</h2>

    <button id="ungu">Ungu</button>
    <button id="biru">Biru</button>
    <button id="hijau">Hijau</button>

    <div id="kotak"></div>

    <button id="sembunyikan">Sembunyikan warna</button>
    <button id="tampilkan">Tampilkan warna</button>

    <script>
        $(document).ready(function () {
            $("#ungu").click(function () {
                $("#kotak").css("background-color", "purple");
            });

            $("#biru").click(function () {
                $("#kotak").css("background-color", "blue");
            });

            $("#hijau").click(function () {
                $("#kotak").css("background-color", "green");
            });

            $("#sembunyikan").click(function () {
                $("#kotak").hide();
            });

            $("#tampilkan").click(function () {
                $("#kotak").show();
            });
        });
    </script>
</body>
</html>
